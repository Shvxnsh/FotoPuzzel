<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Puzzle Photo Booth</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; color: #d4d4d4; font-family: 'Courier New', Courier, monospace; display: flex; height: 100vh; overflow: hidden; }
        #log-panel { width: 25%; background-color: #1e1e1e; border-right: 1px solid #333; padding: 10px; overflow-y: auto; font-size: 12px; box-sizing: border-box; }
        #main-panel { width: 55%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background-color: #252526; }
        #camera-container { position: relative; width: min(640px, 92%); aspect-ratio: 4 / 3; background-color: #000; overflow: hidden; }
        video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #status-text { position: absolute; top: 10px; right: 10px; z-index: 20; background: rgba(0,0,0,.65); padding: 5px 10px; border-radius: 5px; }
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; color: #eebb00; z-index: 20; display: none; text-shadow: 2px 2px 4px #000; }
        #strip-panel { width: 20%; background-color: #efefef; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px 0; overflow-y: auto; box-sizing: border-box; }
        .photo-strip-image { width: 80%; margin-bottom: 15px; border: 5px solid white; box-shadow: 0 4px 8px rgba(0,0,0,.2); filter: grayscale(100%); }
        #test-capture-btn { margin-top: 20px; padding: 10px; cursor: pointer; }
        @media (max-width: 800px) { body { overflow: auto; height: auto; min-height: 100vh; flex-direction: column; } #log-panel, #main-panel, #strip-panel { width: 100%; } #log-panel { max-height: 130px; } #main-panel { min-height: 62vh; padding: 18px 0; } #strip-panel { min-height: 180px; } }
    </style>
</head>
<body>
    <div id="log-panel"><p>// Application starting...</p><div id="debug-logs"></div></div>
    <div id="main-panel">
        <div id="status-text">ESPERANDO MANOS...</div>
        <div id="camera-container">
            <video id="input_video" autoplay playsinline muted></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
            <div id="countdown">3</div>
        </div>
        <button id="test-capture-btn" type="button">Test Capture (Debug)</button>
    </div>
    <div id="strip-panel"><h3>TIRA</h3><div id="photos-container"></div></div>
    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const logPanel = document.getElementById('debug-logs');
        const statusText = document.getElementById('status-text');
        const cameraContainer = document.getElementById('camera-container');
        const FRAME = { x: 170, y: 90, size: 300 };
        let appState = 'WAITING';

        function log(message) {
            const entry = document.createElement('p');
            entry.textContent = `> ${message}`;
            logPanel.appendChild(entry);
            logPanel.parentElement.scrollTop = logPanel.parentElement.scrollHeight;
        }

        function resizeCanvas() {
            const width = videoElement.videoWidth || 640;
            const height = videoElement.videoHeight || 480;
            if (canvasElement.width !== width || canvasElement.height !== height) {
                canvasElement.width = width;
                canvasElement.height = height;
            }
        }

        function distance(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            resizeCanvas();
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            const scaleX = canvasElement.width / 640;
            const scaleY = canvasElement.height / 480;
            const frameSize = FRAME.size * Math.min(scaleX, scaleY);
            const frameX = (canvasElement.width - frameSize) / 2;
            const frameY = (canvasElement.height - frameSize) / 2;

            if (appState !== 'PUZZLE') {
                canvasCtx.strokeStyle = '#47e7ff';
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeRect(frameX, frameY, frameSize, frameSize);
                canvasCtx.strokeStyle = 'rgba(71,231,255,.35)';
                canvasCtx.lineWidth = 1;
                canvasCtx.strokeRect(frameX + 10, frameY + 10, frameSize - 20, frameSize - 20);
            }

            const detected = results.multiHandLandmarks || [];
            statusText.textContent = detected.length ? 'MANOS EN SEGUIMIENTO' : 'ESPERANDO MANOS...';
            detected.forEach((landmarks) => {
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00ff88', lineWidth: 2 });
                drawLandmarks(canvasCtx, landmarks, { color: '#ff4444', lineWidth: 1, radius: 2 });
                if (distance(landmarks[4], landmarks[8]) < 0.05) log('Pinch detected!');
            });
            canvasCtx.restore();
        });

        async function startCamera() {
            try {
                if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera API is unavailable. Use HTTPS or localhost.');
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                videoElement.srcObject = stream;
                await videoElement.play();
                log('Camera started.');
            } catch (error) {
                statusText.textContent = 'CAMERA ERROR';
                log(error.message);
                console.error(error);
            }
        }

        const camera = new Camera(videoElement, { onFrame: async () => hands.send({ image: videoElement }), width: 640, height: 480 });
        camera.start();
        startCamera();

        document.getElementById('test-capture-btn').addEventListener('click', takeSnapshot);

        function takeSnapshot() {
            if (!videoElement.videoWidth) { log('Camera is not ready yet.'); return; }
            log('Capturing image...');
            const tempCanvas = document.createElement('canvas');
            const size = Math.min(videoElement.videoWidth, videoElement.videoHeight);
            tempCanvas.width = 300;
            tempCanvas.height = 300;
            const sourceX = (videoElement.videoWidth - size) / 2;
            const sourceY = (videoElement.videoHeight - size) / 2;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.save();
            tempCtx.translate(300, 0);
            tempCtx.scale(-1, 1);
            tempCtx.drawImage(videoElement, sourceX, sourceY, size, size, 0, 0, 300, 300);
            tempCtx.restore();

            const imgElement = document.createElement('img');
            imgElement.src = tempCanvas.toDataURL('image/png');
            imgElement.alt = 'Captured puzzle photo';
            imgElement.className = 'photo-strip-image';
            document.getElementById('photos-container').prepend(imgElement);
            log('Image added to Tira.');
        }
    </script>
</body>
</html>
